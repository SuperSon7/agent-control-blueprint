schema_version: 1
project_id: bookmark
language: python
rules_version: 0.1.0
documents:
  product: .agent/product.md
  architecture: .agent/architecture.md
  examples: .agent/examples/README.md
commands:
  lint: [python, -m, ruff, check, .]
  format: [python, -m, ruff, format, --check, .]
  test: [python, -m, pytest, -q]
checks:
  required: [lint, format, test]
  architecture:
    required: true
    check_id: module_boundaries
    definition_registered: false
  acceptance:
    controller_owned: true
    removal_requires_separate_review: true
scope:
  allowed_write_paths: [src/**, tests/**, docs/**]
  forbidden_write_paths: [.agent/project.yaml, .agent/rules.generated.md, PROJECT_RULES.md, AGENTS.md, CLAUDE.md, GEMINI.md]
git:
  base_ref: main
  branch_prefix: agent/
  create_draft_pr: false
  auto_merge: false
  allowed_remote: null
roles:
  implementer: codex_subscription
  reviewer: claude_subscription
  local_assistant: ollama_local
  research_on_request: gemini_subscription
deployment:
  enabled: false
  environments: [dev, prod]
  approved_command_ids: []
  allowed_regions: []
  allowed_resource_types: []
  max_resource_count: null
  estimated_monthly_cost_limit: null
  plan_ttl_seconds: 600
  prod_requires_second_factor: true
